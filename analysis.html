<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Insights Dashboard</title>
  <!-- Tailwind CSS CDN for utility architecture layout -->
  <script src="https://tailwindcss.com"></script>
  <!-- Chart.js CDN for client-side graphic chart rendering -->
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 antialiased">

  <div class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- 🎛️ DASHBOARD NAV CONTROLS -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Financial Insights</h1>
        <p class="text-sm text-gray-500 mt-1">Real-time expenditure tracking analysis</p>
      </div>
      
      <!-- Interactive Navigation Filter Toggles -->
      <div class="inline-flex rounded-lg p-1 bg-gray-200/80">
        <button id="btn-monthly" class="px-5 py-2 text-sm font-medium rounded-md shadow-sm bg-white text-gray-900 transition-all duration-200">
          Monthly View
        </button>
        <button id="btn-daily" class="px-5 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 transition-all duration-200">
          Daily View
        </button>
      </div>
    </header>

    <!-- 📈 ROW 1: PRIMARY ANALYTICS CARDS -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <!-- Card Module: Income -->
      <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm flex items-center gap-5">
        <div class="w-12 h-12 bg-green-50 text-green-600 rounded-full flex items-center justify-center font-bold text-xl">↑</div>
        <div>
          <p class="text-xs uppercase tracking-wider font-semibold text-gray-400">Total Income</p>
          <h3 id="card-income" class="text-2xl font-bold text-gray-900 mt-1">--</h3>
        </div>
      </div>

      <!-- Card Module: Expenses with Alert Badge -->
      <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm flex items-center gap-5">
        <div class="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center font-bold text-xl">↓</div>
        <div>
          <p class="text-xs uppercase tracking-wider font-semibold text-gray-400">Total Expenses</p>
          <div class="flex items-center gap-3 mt-1">
            <h3 id="card-expenses" class="text-2xl font-bold text-gray-900">--</h3>
            <span id="badge-alert" class="hidden text-[10px] font-bold bg-red-50 text-red-600 border border-red-100 px-2 py-0.5 rounded uppercase tracking-wider">Alert</span>
          </div>
        </div>
      </div>

      <!-- Card Module: Savings Rate Efficiency -->
      <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm flex items-center gap-5">
        <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center font-bold text-xl">○</div>
        <div>
          <p class="text-xs uppercase tracking-wider font-semibold text-gray-400">Savings Rate</p>
          <h3 id="card-savings" class="text-2xl font-bold text-gray-900 mt-1">--</h3>
        </div>
      </div>
    </section>

    <!-- 📊 ROW 2: GRAPHICAL GRID LAYOUT -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Chart Left Frame Container (Donut Layout) -->
      <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm lg:col-span-5 flex flex-col">
        <h2 class="text-lg font-bold text-gray-800 mb-6">Expense Categories</h2>
        <div class="relative w-full max-w-[280px] mx-auto flex-1 flex items-center justify-center">
          <canvas id="donutChartCanvas"></canvas>
          <!-- Center Absolute Ring Text Overlay -->
          <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-2">
            <span id="chart-center-amount" class="text-xl font-extrabold text-gray-900">--</span>
            <span class="text-xs text-gray-400 font-medium">Spent</span>
          </div>
        </div>
      </div>

      <!-- Linear Framework Progress Bars (Right Frame Container) -->
      <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm lg:col-span-7">
        <h2 class="text-lg font-bold text-gray-800 mb-6">Budget Goals</h2>
        <!-- Asynchronous Injection Node Entry Point -->
        <div id="budget-progress-container" class="space-y-5"></div>
      </div>

    </main>
  </div>

  <!-- ⚙️ RENDERING CONTROLLER & ANIMATION INTERACTIVE SCRIPT -->
  <script>
    let activeDonutChartInstance = null;

    // INTERACTIVE PRESENTATION LEVEL DATA DISPATCHER
    function renderAnalysisPage(data) {
      // 1. Text Metrics Updates
      document.getElementById('card-income').innerText = `$${data.summary.totalIncome.toLocaleString()}`;
      document.getElementById('card-expenses').innerText = `$${data.summary.totalExpenses.toLocaleString()}`;
      document.getElementById('card-savings').innerText = `${data.summary.savingsRatePercentage}%`;
      document.getElementById('chart-center-amount').innerText = `$${data.summary.totalExpenses.toLocaleString()}`;

      // 2. Alert Badge Status Update
      const alertBadge = document.getElementById('badge-alert');
      if (data.summary.hasExpenseAlert) {
        alertBadge.classList.remove('hidden');
      } else {
        alertBadge.classList.add('hidden');
      }

      // 3. Dynamic Generation Loop for Budget Progress Bars
      const progressContainer = document.getElementById('budget-progress-container');
      progressContainer.innerHTML = ''; // Sanitize view content container
      
      data.budgetGoals.forEach(goal => {
        const componentMarkup = `
          <div>
            <div class="flex justify-between items-center text-sm font-medium mb-1.5">
              <span class="text-gray-700 font-semibold">${goal.name}</span>
              <span class="text-gray-500">(${goal.spentPercentage}%)</span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-2.5">
              <div class="h-2.5 rounded-full transition-all duration-500" 
                   style="width: ${goal.spentPercentage}%; background-color: ${goal.statusColor};"></div>
            </div>
          </div>
        `;
        progressContainer.insertAdjacentHTML('beforeend', componentMarkup);
      });

      // 4. Hardware-Accelerated Donut Chart Generation
      const ctx = document.getElementById('donutChartCanvas').getContext('2d');
      
      if (activeDonutChartInstance) {
        activeDonutChartInstance.destroy(); // Clear existing canvas context instance if rendering updates
      }

      const labels = data.expenseCategories.map(item => item.category);
      const amounts = data.expenseCategories.map(item => item.amount);
      const colors = data.expenseCategories.map(item => item.colorCode);

      activeDonutChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: amounts,
            backgroundColor: colors,
            borderWidth: 2,
            borderColor: '#ffffff',
            hoverOffset: 4
          }]
        },
        options: {
          cutout: '72%',
          plugins: {
            legend: {
              position: 'right',
              labels: {
                usePointStyle: true,
                pointStyle: 'circle',
                padding: 18,
                font: { size: 12, weight: '500' },
                color: '#4B5563'
              }
            }
          },
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    // INTERACTIVE HEADER UI TOGGLE NAVIGATION LOGIC
    const monthlyBtn = document.getElementById('btn-monthly');
    const dailyBtn = document.getElementById('btn-daily');

    monthlyBtn.addEventListener('click', () => {
      monthlyBtn.className = "px-5 py-2 text-sm font-medium rounded-md shadow-sm bg-white text-gray-900 transition-all duration-200";
      dailyBtn.className = "px-5 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 transition-all duration-200";
    });

    dailyBtn.addEventListener('click', () => {
      dailyBtn.className = "px-5 py-2 text-sm font-medium rounded-md shadow-sm bg-white text-gray-900 transition-all duration-200";
      monthlyBtn.className = "px-5 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 transition-all duration-200";
    });

    // =========================================================================
    // 🧪 FRONTEND INITIALIZATION LOOP (MOCK PLACEHOLDER LAYER)
    // =========================================================================
    // When you attach the backend, replace this call with your fetch() hook.
    document.addEventListener("DOMContentLoaded", () => {
      const mockPayload = {
        summary: { totalIncome: 5200, totalExpenses: 3450, savingsRatePercentage: 33.7, hasExpenseAlert: true },
        expenseCategories: [
          { category: "Food", amount: 850, colorCode: "#FFB38A" },
          { category: "Shopping", amount: 750, colorCode: "#8AB9FF" },
          { category: "Housing", amount: 1100, colorCode: "#C299FF" },
          { category: "Utilities", amount: 350, colorCode: "#FFE28A" },
          { category: "Transportation", amount: 250, colorCode: "#8AFFB3" },
          { category: "Others", amount: 150, colorCode: "#D3D3D3" }
        ],
        budgetGoals: [
          { name: "Groceries", spentPercentage: 65, statusColor: "#2EC4B6" },
          { name: "Rent", spentPercentage: 100, statusColor: "#E63946" },
          { name: "Dining Out", spentPercentage: 75, statusColor: "#F77F00" },
          { name: "Transportation", spentPercentage: 50, statusColor: "#457B9D" },
